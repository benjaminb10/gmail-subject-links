<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:800px;overflow:hidden;background:#eef1f6;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;color:#1f1f1f}
.wrap{padding:0 90px;height:800px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}.card{align-self:stretch}
h1{font-size:40px;margin:0 0 8px}.sub{font-size:21px;color:#555;margin:0 0 44px}
.card{background:#fff;border-radius:20px;box-shadow:0 2px 6px rgba(0,0,0,.08);padding:40px 44px}
h2{font-size:30px;font-weight:400;margin:0 0 24px}
a{color:#1a73e8;text-decoration:underline}
.meta{display:flex;gap:14px;align-items:center;font-size:17px}.av{width:44px;height:44px;border-radius:50%;background:#7cacf8;color:#fff;display:grid;place-items:center;font-weight:700}
small{color:#666}
.tab{margin-top:34px;display:inline-flex;gap:10px;align-items:center;background:#fff;border:1px solid #dadce0;border-radius:12px;padding:12px 18px;font-size:17px}
.dot{width:12px;height:12px;border-radius:50%;background:#34a853}
</style></head><body><div class="wrap">
<h1>One click, new tab</h1><p class="sub">The link opens in a new tab. Your emails are never modified, and nothing leaves your browser.</p>
<div class="card"><h2>Read later <a>https://example.com/blog/how-we-ship</a></h2>
<div class="meta"><span class="av">A</span><div><b>Alex Martin</b> <small>&lt;alex@example.com&gt;</small><br><small>to me</small></div></div></div>
<div class="tab"><span class="dot"></span>example.com/blog/how-we-ship opened in a new tab</div>
</div></body></html>
